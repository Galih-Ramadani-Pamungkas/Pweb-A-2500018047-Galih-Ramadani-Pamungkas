<!DOCTYPE html>
<html>
<head>
  <title>Layout 3 Kolom 2 Baris</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    .header {
      background: #4CAF50;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .row {
      display: flex;
    }

    .column {
      flex: 1;
      padding: 20px;
      text-align: center;
    }

    .left {
      background: #f1f1f1;
    }

    .middle {
      background: #ddd;
    }

    .right {
      background: #f1f1f1;
    }

    .footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>

  <div class="header">
    Header
  </div>

  <div class="row">
    <div class="column left">
      Sidebar Kiri
    </div>
    <div class="column middle">
      Konten Utama
    </div>
    <div class="column right">
      Sidebar Kanan
    </div>
  </div>

  <div class="footer">
    Footer
  </div>

</body>
</html>
